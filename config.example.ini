; Headroom configuration
; Copy to ~/.config/headroom/config.ini and edit. Restart the service after changes:
;   systemctl --user restart headroom
; Lines starting with ; are comments. "~" expands to your home directory.

[server]
; 127.0.0.1 = only reachable through Ultra.cc's Nginx proxy (recommended).
; 0.0.0.0   = also reachable directly at http://<server>:<port>/
host = 127.0.0.1
; MUST be a port assigned to your Ultra.cc account (see INSTALL-ULTRACC.md).
port = 12345
; URL path when served behind Nginx, e.g. /headroom  ->  https://user.host.usbx.me/headroom/
; Must match the "location" in your Nginx proxy.d file. Leave empty to serve at "/".
base_url = /headroom

[monitor]
; Seconds between quota readings (minimum 60). 300 = every 5 minutes.
poll_interval = 300
; Readings older than this many days are deleted (checked once a day).
retention_days = 365
; Command used to read the quota. Do not change to df: df shows the shared
; server disk, not your allocation.
quota_command = quota -s
; Optional: the filesystem/device to report if quota lists more than one.
; Leave empty to use the one with the largest allocation.
filesystem =

[thresholds]
; Percentage of your allocation at which each warning level starts.
warning = 80
high = 90
critical = 95

[directories]
; Largest-directory report. Runs "du" at the lowest CPU/IO priority.
enabled = true
; Directory to analyse. Click a folder on the dashboard to see inside it.
path = ~
; How many levels below "path" one scan records (1-8). Higher lets you drill
; down further; the scan takes about the same time, it just stores more rows.
depth = 4
; Seconds between scans (minimum 600). 21600 = every 6 hours.
scan_interval = 21600
; Give up on a scan after this many seconds.
timeout = 1800
; Number of folders to show per level (the rest are summed into one row).
top_n = 15
; Comma-separated du --exclude patterns (optional), e.g. .cache,*.tmp
exclude =

[reclaim]
; The "Space you could free" report, built by the same scan. Headroom only
; reports: it never deletes anything.
; How many of the largest files to list (0 turns the list off).
largest_files = 25
; Files at least this many MiB are checked for duplicates (0 = off). Same-size
; files are compared by reading 1 MiB from the start, middle and end.
duplicate_min_size_mb = 100
; Report well-known cache, log and trash folders (~/.cache, Plex cache and
; logs, ~/.config/*/logs and Backups, trash folders).
junk_defaults = true
; Extra folders to report as junk, relative to [directories] path. "*" also
; matches "/". Example: .local/share/rclone-cache, */Plex Media Server/Codecs
junk =

[transmission]
; Find leftover downloads: files in Transmission's download folders that no
; torrent uses any more. Headroom only reads the torrent list.
enabled = false
; RPC address. Leave empty to read the port from Transmission's own
; ~/.config/transmission-daemon/settings.json.
url =
; The username and password you log in to Transmission's web UI with.
; Keep this file private (install.sh sets it to mode 600).
username =
password =
; Extra folders to check, comma-separated (optional). Transmission's default
; download folder, its incomplete folder and every torrent's folder are
; checked anyway.
download_dirs =

[storage]
; Where the SQLite database and log file live.
data_dir = ~/.local/share/headroom

[auth]
; Optional HTTP Basic authentication. Strongly recommended if the app is
; reachable from the internet (it is, once behind the Nginx proxy).
; Generate a hash with:  ~/headroom/.venv/bin/python -m headroom --hash-password
username =
password_hash =
