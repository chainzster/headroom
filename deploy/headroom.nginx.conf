# Ultra.cc Nginx reverse proxy for Headroom.
# Install to ~/.apps/nginx/proxy.d/headroom.conf, then run:  app-nginx restart
# Replace 12345 with the port in your config.ini. The path (/headroom) must
# match base_url in config.ini.
#
# Note: proxy_pass has NO trailing path, so Nginx forwards /headroom/... intact
# and Headroom strips the prefix itself.

location /headroom/ {
    proxy_pass              http://127.0.0.1:12345;
    proxy_http_version      1.1;
    proxy_set_header        Host                    $host;
    proxy_set_header        X-Forwarded-Host        $http_host;
    proxy_set_header        X-Forwarded-Proto       $scheme;
    proxy_set_header        X-Forwarded-For         $proxy_add_x_forwarded_for;
}
